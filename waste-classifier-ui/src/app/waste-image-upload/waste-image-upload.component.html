<div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col gap-6 max-w-100">
  <h2 class="text-xl font-bold text-center text-slate-800">Upload Your Waste Image</h2>
  <div
    class="relative w-full border-2 rounded-xl flex items-center justify-center h-64 transition-colors overflow-hidden hover:border-emerald-400 hover:bg-emerald-50/30"
    [class.border-dashed]="!imageUrl()"
    [class.border-slate-300]="!imageUrl()"
    [class.border-solid]="imageUrl()"
    [class.border-slate-200]="imageUrl()">

    @if (imageUrl(); as url) {
      <img [src]="url"
           alt="Preview of uploaded waste"
           class="w-full h-full object-contain p-4" />
    } @else {
      <div class="flex flex-col items-center justify-center text-slate-400 gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p>Click or drag image to upload</p>
        <p>Image format must be a .jpg or .png</p>
      </div>
    }

    <input
      type="file"
      accept=".jpg, .png"
      (change)="onFileSelected($event)"
      class="absolute inset-0 opacity-0 cursor-pointer"
      aria-label="Upload waste image"
    />
  </div>
  @if (selectedFile()) {
    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-100 h-15.5">
      <div class="flex flex-col text-sm">
        <p class="text-slate-500 font-medium">Image Uploaded:</p>
        <p class="text-slate-700 font-semibold max-w-50 truncate">
          {{selectedFile()?.name}}
        </p>
        {{displayFileSize() | number:'1.0-2' }} MB
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-center p-3 rounded-lg h-15.5">
      <p class="text-xs text-slate-400 italic"></p>
    </div>
  }

  <button
    type="button"
    (click)="onSubmission()"
    [disabled]="imageControl.invalid || imageClassifierService.prediction.isLoading()"
    class="w-full py-3 px-6 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold rounded-xl transition-colors"
    [class.cursor-progress]="imageClassifierService.prediction.isLoading()"
    [class.cursor-not-allowed]="imageControl.invalid"
    [class.cursor-pointer]="imageControl.valid && !imageClassifierService.prediction.isLoading()"
  >
    @if (imageClassifierService.prediction.isLoading()) {
      THINKING...
    }@else if(imageClassifierService.prediction.hasValue()){
      FEED OTHER WASTE
    } @else {
      SORT WASTE
    }
  </button>
</div>
