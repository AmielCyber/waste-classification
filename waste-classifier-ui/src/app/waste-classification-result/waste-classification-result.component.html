<div class="mx-auto mt-6 mb-8 max-w-5xl min-h-19">
  @if (prediction.hasValue()) {
    <div
      class="flex flex-col sm:flex-row w-full items-center justify-center gap-4 sm:gap-6 rounded-xl border border-green-200 bg-green-50 px-6 py-6 sm:px-8 sm:py-5 shadow-sm text-lg text-center sm:text-left text-green-600"
    >
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-green-600 font-bold text-white">
        ✓
      </div>

      <div class="h-px w-full bg-gray-300 sm:h-6 sm:w-px"></div>

      <div>
        <span class="block font-semibold text-slate-700 sm:inline sm:pr-1">Detected Waste Type:</span>
        <span class="font-bold"> {{ prediction.value().type }} </span>
      </div>

      <div class="h-px w-full bg-gray-300 sm:h-6 sm:w-px"></div>

      <div>
        <span class="block font-semibold text-slate-700 sm:inline sm:pr-1">Confidence:</span>
        <span class="font-bold"> {{ prediction.value().confidence | percent }} </span>
      </div>
    </div>
  } @else {
    <div
      class="flex h-19 w-full items-center justify-center rounded-xl border border-dashed border-slate-200 bg-slate-50 text-slate-400"
    >
      Feed your trash image below to properly disposed.
    </div>
  }
</div>
