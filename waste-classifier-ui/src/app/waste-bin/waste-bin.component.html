<div role="img" [attr.aria-label]="wasteType() + ' waste bin'" class="relative max-w-35 mx-auto group">

  @if (isHighlighted()) {
    <div
      class="absolute inset-0 bg-green-500/40 rounded-3xl blur-2xl scale-110 transition-all duration-500 ease-in-out -z-10 animate-pulse"
      style="animation-duration: 3s;">
    </div>
  }

  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 200 250"
    width="100%"
    aria-hidden="true"
    [class]="isHighlighted()
      ? 'drop-shadow-[0_0_12px_rgba(34,197,94,1.0)] scale-110 transition-all duration-500 ease-in-out height-auto'
      : 'transition-all duration-500 ease-in-out height-auto'">

    <defs>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
      </filter>

      <linearGradient id="lightOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
    </defs>

    <g>
      <rect x="80" y="15" width="40" height="15" rx="7.5" [attr.fill]="binColor()" />
      <rect x="80" y="15" width="40" height="15" rx="7.5" fill="#000000" opacity="0.15" />
    </g>

    <path
      d="M 45 48 L 155 48 L 142 215 A 12 12 0 0 1 130 226 L 70 226 A 12 12 0 0 1 58 215 Z"
      [attr.fill]="binColor()"
      filter="url(#softShadow)"
    />

    <path
      d="M 45 48 L 155 48 L 142 215 A 12 12 0 0 1 130 226 L 70 226 A 12 12 0 0 1 58 215 Z"
      fill="url(#lightOverlay)"
    />

    <path
      d="M 45 48 L 100 48 L 100 226 L 70 226 A 12 12 0 0 1 58 215 Z"
      fill="#ffffff"
      opacity="0.15"
    />

    <rect
      x="35"
      y="30"
      width="130"
      height="18"
      rx="9"
      [attr.fill]="binColor()"
      filter="url(#softShadow)"
    />

    <rect
      x="55"
      y="115"
      width="90"
      height="32"
      rx="16"
      fill="#ffffff"
      filter="url(#softShadow)"
    />

    <text
      x="100"
      y="136"
      text-anchor="middle"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="14"
      font-weight="800"
      [attr.fill]="binColor()"
      letter-spacing="1.5">
      {{ wasteType() | uppercase }}
    </text>
  </svg>

  @if (isHighlighted()) {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 40"
      class="absolute -top-2 -right-2 w-11 h-11 drop-shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-fade-in-scale"
      aria-hidden="true">

      <circle cx="20" cy="20" r="17" fill="#22c55e" stroke="white" stroke-width="3" />

      <path
        d="M 13 20.5 L 18 25.5 L 27 16.5"
        stroke="white"
        stroke-width="3.5"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
</div>
